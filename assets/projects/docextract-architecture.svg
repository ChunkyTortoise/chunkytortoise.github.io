<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">DocExtract request path and CI eval path</title><desc id="d">Request path: upload to FastAPI, queue on Redis and ARQ, then a worker classifies, runs two-pass extraction with an injection guard, validates, embeds, and stores in Postgres with pgvector. Questions run through an agentic RAG loop over vector, BM25 and hybrid tools. CI path: an offline replay of 28 committed fixtures is checked against an accuracy floor.</desc>
<rect width="960" height="500" rx="12" fill="#1c1917"/><defs>
<marker id="mclay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cc785c"/></marker>
<marker id="mteal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8fb8b0"/></marker>
<marker id="mstone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8a29e"/></marker>
</defs>
<text x="32" y="44" font-size="13" letter-spacing="1.8" fill="#cc785c">REQUEST PATH</text>
<rect x="32.0" y="64" width="147.2" height="64" rx="8" fill="#292524" stroke="#cc785c" stroke-width="1.5"/>
<text x="105.6" y="91" font-size="14.5" fill="#f5f5f4" text-anchor="middle">Upload</text>
<text x="105.6" y="111" font-size="14.5" fill="#f5f5f4" text-anchor="middle">PDF or image</text>
<line x1="179.2" y1="96" x2="215.2" y2="96" stroke="#cc785c" stroke-width="2" marker-end="url(#mclay)"/>
<rect x="219.2" y="64" width="147.2" height="64" rx="8" fill="#292524" stroke="#cc785c" stroke-width="1.5"/>
<text x="292.8" y="91" font-size="14.5" fill="#f5f5f4" text-anchor="middle">FastAPI</text>
<text x="292.8" y="111" font-size="14.5" fill="#f5f5f4" text-anchor="middle">API</text>
<line x1="366.4" y1="96" x2="402.4" y2="96" stroke="#cc785c" stroke-width="2" marker-end="url(#mclay)"/>
<rect x="406.4" y="64" width="147.2" height="64" rx="8" fill="#292524" stroke="#cc785c" stroke-width="1.5"/>
<text x="480.0" y="91" font-size="14.5" fill="#f5f5f4" text-anchor="middle">Redis + ARQ</text>
<text x="480.0" y="111" font-size="14.5" fill="#f5f5f4" text-anchor="middle">queue</text>
<line x1="553.6" y1="96" x2="589.6" y2="96" stroke="#cc785c" stroke-width="2" marker-end="url(#mclay)"/>
<rect x="593.6" y="64" width="147.2" height="64" rx="8" fill="#292524" stroke="#cc785c" stroke-width="1.5"/>
<text x="667.2" y="91" font-size="14.5" fill="#f5f5f4" text-anchor="middle">Classify</text>
<text x="667.2" y="111" font-size="14.5" fill="#f5f5f4" text-anchor="middle">Haiku, Sonnet fallback</text>
<line x1="740.8" y1="96" x2="776.8" y2="96" stroke="#cc785c" stroke-width="2" marker-end="url(#mclay)"/>
<rect x="780.8" y="64" width="147.2" height="64" rx="8" fill="#292524" stroke="#cc785c" stroke-width="1.5"/>
<text x="854.4" y="91" font-size="14.5" fill="#f5f5f4" text-anchor="middle">Two-pass extract</text>
<text x="854.4" y="111" font-size="14.5" fill="#f5f5f4" text-anchor="middle">+ injection guard</text>
<text x="32" y="174" font-size="13" letter-spacing="1.8" fill="#cc785c">STORAGE AND SEARCH</text>
<rect x="32.0" y="194" width="194.0" height="64" rx="8" fill="#292524" stroke="#cc785c" stroke-width="1.5"/>
<text x="129.0" y="221" font-size="14.5" fill="#f5f5f4" text-anchor="middle">Validate</text>
<text x="129.0" y="241" font-size="14.5" fill="#f5f5f4" text-anchor="middle">Pydantic schemas</text>
<line x1="226.0" y1="226" x2="262.0" y2="226" stroke="#cc785c" stroke-width="2" marker-end="url(#mclay)"/>
<rect x="266.0" y="194" width="194.0" height="64" rx="8" fill="#292524" stroke="#cc785c" stroke-width="1.5"/>
<text x="363.0" y="221" font-size="14.5" fill="#f5f5f4" text-anchor="middle">Embed</text>
<text x="363.0" y="241" font-size="14.5" fill="#f5f5f4" text-anchor="middle">Gemini</text>
<line x1="460.0" y1="226" x2="496.0" y2="226" stroke="#cc785c" stroke-width="2" marker-end="url(#mclay)"/>
<rect x="500.0" y="194" width="194.0" height="64" rx="8" fill="#292524" stroke="#cc785c" stroke-width="1.5"/>
<text x="597.0" y="221" font-size="14.5" fill="#f5f5f4" text-anchor="middle">Postgres</text>
<text x="597.0" y="241" font-size="14.5" fill="#f5f5f4" text-anchor="middle">+ pgvector HNSW</text>
<line x1="694.0" y1="226" x2="730.0" y2="226" stroke="#cc785c" stroke-width="2" marker-end="url(#mclay)"/>
<rect x="734.0" y="194" width="194.0" height="64" rx="8" fill="#292524" stroke="#cc785c" stroke-width="1.5"/>
<text x="831.0" y="221" font-size="14.5" fill="#f5f5f4" text-anchor="middle">Agentic RAG</text>
<text x="831.0" y="241" font-size="14.5" fill="#f5f5f4" text-anchor="middle">vector, BM25, hybrid</text>
<text x="32" y="304" font-size="13" letter-spacing="1.8" fill="#8fb8b0">CI ONLY, NOT ON THE REQUEST PATH</text>
<rect x="32.0" y="324" width="272.0" height="64" rx="8" fill="#292524" stroke="#8fb8b0" stroke-width="1.5"/>
<text x="168.0" y="351" font-size="14.5" fill="#f5f5f4" text-anchor="middle">Pull request</text>
<text x="168.0" y="371" font-size="14.5" fill="#f5f5f4" text-anchor="middle">touches prompts or extractor</text>
<line x1="304.0" y1="356" x2="340.0" y2="356" stroke="#8fb8b0" stroke-width="2" marker-end="url(#mteal)"/>
<rect x="344.0" y="324" width="272.0" height="64" rx="8" fill="#292524" stroke="#8fb8b0" stroke-width="1.5"/>
<text x="480.0" y="351" font-size="14.5" fill="#f5f5f4" text-anchor="middle">Offline replay</text>
<text x="480.0" y="371" font-size="14.5" fill="#f5f5f4" text-anchor="middle">28 committed fixtures</text>
<line x1="616.0" y1="356" x2="652.0" y2="356" stroke="#8fb8b0" stroke-width="2" marker-end="url(#mteal)"/>
<rect x="656.0" y="324" width="272.0" height="64" rx="8" fill="#292524" stroke="#8fb8b0" stroke-width="1.5"/>
<text x="792.0" y="351" font-size="14.5" fill="#f5f5f4" text-anchor="middle">Accuracy floor</text>
<text x="792.0" y="371" font-size="14.5" fill="#f5f5f4" text-anchor="middle">check fails below it</text>
<text x="32" y="458" font-size="13" fill="#a8a29e">Simplified from the mermaid architecture diagram in the DocExtract README.</text>
<text x="32" y="480" font-size="11.5" fill="#78716c">Source: github.com/ChunkyTortoise/docextract</text></svg>
