<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Acuity SMS qualification flow</title><desc id="d">Inbound SMS leads arrive in GoHighLevel, the CRM of record. A FastAPI service with Redis applies broker-defined qualification rules and writes updates back to the CRM. Spanish-language messages are detected and handed to a human, and any lead the bot should not handle goes to human handoff.</desc>
<rect width="960" height="370" rx="12" fill="#1c1917"/><defs>
<marker id="mclay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cc785c"/></marker>
<marker id="mteal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8fb8b0"/></marker>
<marker id="mstone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8a29e"/></marker>
</defs>
<text x="32" y="44" font-size="13" letter-spacing="1.8" fill="#cc785c">LEAD INTAKE</text>
