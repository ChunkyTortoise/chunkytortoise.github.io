<rect x="219.2" y="64" width="147.2" height="64" rx="8" fill="#292524" stroke="#cc785c" stroke-width="1.5"/>
<text x="292.8" y="91" font-size="14.5" fill="#f5f5f4" text-anchor="middle">GoHighLevel</text>
<text x="292.8" y="111" font-size="14.5" fill="#f5f5f4" text-anchor="middle">CRM of record</text>
<line x1="366.4" y1="96" x2="402.4" y2="96" stroke="#cc785c" stroke-width="2" marker-end="url(#mclay)"/>
<rect x="406.4" y="64" width="147.2" height="64" rx="8" fill="#292524" stroke="#cc785c" stroke-width="1.5"/>
<text x="480.0" y="91" font-size="14.5" fill="#f5f5f4" text-anchor="middle">FastAPI service</text>
<text x="480.0" y="111" font-size="14.5" fill="#f5f5f4" text-anchor="middle">+ Redis state</text>
<line x1="553.6" y1="96" x2="589.6" y2="96" stroke="#cc785c" stroke-width="2" marker-end="url(#mclay)"/>
<rect x="593.6" y="64" width="147.2" height="64" rx="8" fill="#292524" stroke="#cc785c" stroke-width="1.5"/>
<text x="667.2" y="91" font-size="14.5" fill="#f5f5f4" text-anchor="middle">Qualification</text>
<text x="667.2" y="111" font-size="14.5" fill="#f5f5f4" text-anchor="middle">broker-defined rules</text>
<line x1="740.8" y1="96" x2="776.8" y2="96" stroke="#cc785c" stroke-width="2" marker-end="url(#mclay)"/>
<rect x="780.8" y="64" width="147.2" height="64" rx="8" fill="#292524" stroke="#cc785c" stroke-width="1.5"/>
<text x="854.4" y="91" font-size="14.5" fill="#f5f5f4" text-anchor="middle">CRM update</text>
<text x="854.4" y="111" font-size="14.5" fill="#f5f5f4" text-anchor="middle">written back to GHL</text>
